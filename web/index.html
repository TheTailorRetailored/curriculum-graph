<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Curriculum Graph</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <header class="brand">
          <div>
            <h1>Curriculum Graph</h1>
            <p id="snapshotLabel">Loading graph</p>
          </div>
          <button id="reloadButton" class="icon-button" title="Reload graph" aria-label="Reload graph">R</button>
        </header>

        <label class="field">
          <span>Search</span>
          <input id="searchInput" type="search" placeholder="fractions, linear equations, area">
        </label>

        <section class="filter-section">
          <div class="section-title">View</div>
          <div id="typeFilters" class="chips"></div>
        </section>

        <section class="filter-section">
          <div class="section-title">Subject</div>
          <select id="subjectFilter"></select>
        </section>

        <section class="filter-section">
          <div class="section-title">Strand</div>
          <select id="strandFilter"></select>
        </section>

        <section class="filter-section">
          <div class="section-title">Area</div>
          <select id="areaFilter"></select>
        </section>

        <section class="metrics" id="metricsPanel"></section>
      </aside>

      <main class="stage">
        <div class="toolbar">
          <div class="segmented" role="tablist" aria-label="Graph mode">
            <button class="mode-button active" data-mode="overview">Overview</button>
            <button class="mode-button" data-mode="neighbourhood">Neighbourhood</button>
          </div>
          <div class="toolbar-actions">
            <button id="fitButton" class="tool-button">Fit</button>
            <button id="labelsButton" class="tool-button active">Labels</button>
          </div>
        </div>
        <canvas id="graphCanvas"></canvas>
        <div id="emptyState" class="empty-state" hidden>No matching nodes</div>
      </main>

      <aside class="details">
        <section class="detail-block hero-detail">
          <div class="eyebrow" id="detailType">No selection</div>
          <h2 id="detailTitle">Select a node</h2>
          <p id="detailDescription">Click a node in the graph or choose a result from search to inspect relationships, provenance, and source location.</p>
        </section>

        <section class="detail-block">
          <div class="section-title">Properties</div>
          <dl id="propertyList" class="properties"></dl>
        </section>

        <section class="detail-block">
          <div class="section-title">Attached Edges</div>
          <div id="edgeList" class="edge-list"></div>
        </section>
      </aside>
    </div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
